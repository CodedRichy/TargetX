[package]
name = "targetx"
version = "0.3.0"
description = "KTU 2024 academic tracker"
authors = ["CodedRichy"]
license = "BUSL-1.1"
repository = "https://github.com/CodedRichy/TargetX"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "targetx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# rustls rather than the system TLS stack: one less thing that differs
# between a developer machine and a student's laptop.
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls", "charset", "json"] }
tokio = { version = "1", features = ["rt", "macros"] }
# Sign-in (RFC 8252). PKCE needs a CSPRNG and SHA-256, and the challenge is
# base64url. No OAuth crate: the flow is one authorize URL and one form post,
# and a library for that would be more surface than the code it replaces.
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-fs = "2.5.1"

# Opt-in portal-credential storage (issue #2). Scoped to Windows, where the
# store is Credential Manager (DPAPI, per-user). The native backend pulls only
# the Windows API crate, no system service, so the mac/Linux builds are
# untouched - there `creds.rs` compiles its no-op backend and never links this.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
