# Tests, on every push and every pull request.
#
# `release.yml` also runs the suite, but only once a tag exists - by which
# point a regression is already something you have to un-tag rather than
# something you have to fix. This is the one that catches it while it is
# still cheap.
#
# The engine is the product: a build that computes a mark wrongly does not
# look broken, it reports a wrong number as confidently as a right one. The
# parity job below is the only thing standing between that and a student.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: types and tests
    runs-on: ubuntu-22.04
    steps:
      # Full history, not the default shallow clone: the parity gate below
      # diffs against 9b2bdc2, and at depth 1 that commit does not exist in
      # the checkout - the step would fail as a git error rather than pass.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      # Strict mode with noUncheckedIndexedAccess: this catches a whole class
      # of the defects this codebase has actually shipped.
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: app

      - name: Tests
        run: npm test
        working-directory: app

      # The parity corpus is generated by the retired Python build in legacy/
      # and has been byte-identical since 9b2bdc2 across eighteen tasks. It is
      # a fixture, not an output: a diff means someone regenerated it to make a
      # failing test pass, which is the one way this suite can be defeated
      # without any test going red.
      - name: Parity corpus is unmodified
        run: |
          if ! git diff --quiet 9b2bdc2 -- app/src/engine/__tests__/parity.json; then
            echo "::error::parity.json differs from 9b2bdc2. It is frozen: regenerating it to make a test pass hides an engine regression."
            git diff --stat 9b2bdc2 -- app/src/engine/__tests__/parity.json
            exit 1
          fi
          echo "parity.json unchanged since 9b2bdc2"

  # The Worker is deployed separately and was outside CI entirely, which meant
  # `parseAction` - the last of the three topic restrictions, and the only one
  # that runs on code we control rather than on a remote service's behaviour -
  # had nothing checking it on any push.
  worker:
    name: worker types and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
        working-directory: worker

      - name: Typecheck
        run: npm run typecheck
        working-directory: worker

      - name: Tests
        run: npm test
        working-directory: worker

  rust:
    name: rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # tauri::generate_context! reads the frontend dist and the capability
      # files, so the Rust side does not compile without the JS side present.
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      # Also validates the capability permission names: an unknown permission
      # in capabilities/default.json fails at codegen, not at runtime, and this
      # is where that shows up.
      - name: cargo check
        run: cargo check --manifest-path app/src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml -- -D warnings
