# Build and publish a release, and the update feed the installed app reads.
#
# The app checks `releases/latest/download/latest.json` a couple of seconds
# after launch (see `app/src/sync/update.ts`). That file is produced HERE, by
# `createUpdaterArtifacts` in tauri.conf.json plus tauri-action's release step -
# it is not committed and must never be hand-written, because it carries the
# signature that the installed binary verifies against the public key baked
# into it. An unsigned or wrongly signed feed does not warn: the updater simply
# refuses it and every student silently stays on an old build.
#
# REQUIRED REPOSITORY SECRETS (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/targetx-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.tauri/targetx-updater.password
#
# Lose that private key and you cannot ship an update to anyone who already
# installed: their build only trusts the matching public key. Keep the file.
#
# To cut a release: bump `version` in app/src-tauri/tauri.conf.json (this is the
# version the updater compares against, not package.json), commit, then
#   git tag v0.2.0 && git push origin v0.2.0
#
# THEN PUBLISH THE DRAFT. This workflow leaves the release as a draft on
# purpose - a bad build should not reach students automatically - but GitHub
# does not treat a draft as "latest", so `releases/latest/download/latest.json`
# keeps serving the PREVIOUS release until you press publish. Nothing fails
# and nothing warns; the update simply never appears. If a release seems to
# have shipped and no one is being offered it, check this first.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    # Hoisted so the steps' `if` conditions can test them through the `env`
    # context: a step-level `if` that dereferences the secrets context is not
    # reliably supported, and a release pipeline is the wrong place to find
    # that out. Absent secrets arrive as empty strings - which for the
    # certificate means none has been bought yet and the build proceeds
    # unsigned, and for the updater key means the release must not happen.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      # The updater key is not optional, and its absence is silent. A build
      # with no TAURI_SIGNING_PRIVATE_KEY still bundles both installers, still
      # prints only "A public key has been found, but no private key", and
      # still EXITS 0 - verified locally on 2026-08-29. So the release goes
      # green, the .sig files and latest.json are simply missing, and every
      # existing install keeps polling a feed that never mentions the new
      # version. Nobody finds out until someone asks why they were never
      # offered an update. Fail here instead, before anything is uploaded.
      - name: Refuse to release without the updater signing key
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY is empty."
          echo "Without it this build produces installers but no signed update"
          echo "payload, and no installed copy of TargetX will ever be offered"
          echo "this version. See SIGNING.md."
          exit 1

      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci
        working-directory: app

      # The engine is the product: a release that computes a mark wrongly is
      # worse than no release, and this is the last point at which that is
      # cheap to catch. Includes the parity corpus against the Python oracle.
      - run: npm test
        working-directory: app

      # Authenticode. Skipped entirely when the secret is absent, so the
      # pipeline keeps producing (unsigned) builds before a certificate is
      # bought rather than failing every release until then.
      #
      # This is NOT the same signature as TAURI_SIGNING_PRIVATE_KEY below.
      # That one signs the update payload so an installed TargetX will accept
      # it. This one is what makes WINDOWS itself trust the installer: without
      # it a student double-clicking the .exe gets SmartScreen telling them the
      # publisher is unknown and not to run it, and no college IT department
      # will deploy that. Both are required; neither substitutes for the other.
      #
      # The condition reads `env`, not `secrets`: a step-level `if` that
      # dereferences the secrets context is not reliably supported, and a
      # release pipeline is the wrong place to find that out. The job-level env
      # block below hoists it, and `env` in a step `if` is unambiguous.
      - name: Import the Windows signing certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        run: |
          New-Item -ItemType directory -Path certificate
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -path certificate -include tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS notarisation. Absent these, the .dmg is unsigned and Gatekeeper
          # refuses it outright rather than merely warning, as Windows does.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: TargetX ${{ github.ref_name }}
          releaseBody: |
            Installed TargetX offers this update on its own the next time you
            open it. You do not need to download anything here.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # The gate above catches the one cause we know about - an empty secret.
      # This catches the rest: a wrong key, a password that does not decrypt
      # it, a bundler that skipped the updater target. All of them end the same
      # way, with a green build, installers, and no payload any installed copy
      # will ever be offered. Checked after the fact because the only reliable
      # evidence that signing happened is a signature.
      - name: Verify an updater payload was actually signed
        shell: bash
        run: |
          found=$(find app/src-tauri/target -name '*.sig' 2>/dev/null | head -20)
          if [ -z "$found" ]; then
            echo "The build produced no .sig file, so there is no signed update"
            echo "payload in this release. Installed copies of TargetX would"
            echo "never be offered it. See SIGNING.md."
            exit 1
          fi
          echo "signed:"; echo "$found"

      # Until there is a code-signing certificate, Windows tells every student
      # the publisher is unknown and a college IT department has nothing to
      # check the download against. A checksum is not a substitute for a
      # signature - it proves the file did not change in transit, not who made
      # it - but it is the difference between "trust the download" and "verify
      # the download", and it costs nothing to publish.
      #
      # Named per platform because all three matrix jobs upload into the same
      # release and a shared filename would have each one clobber the last.
      - name: Publish SHA-256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out="SHA256SUMS-${{ matrix.platform }}.txt"
          find app/src-tauri/target -path '*bundle*' -type f             \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg'                -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \)             -print0 | xargs -0 -r sha256sum | sed 's#[^ ]*/##' > "$out"
          if [ ! -s "$out" ]; then echo "No installer to checksum."; exit 1; fi
          cat "$out"
          gh release upload "${{ github.ref_name }}" "$out" --clobber
